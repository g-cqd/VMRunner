# Pinned releases of the tools the gate downloads: the three static analyzers, SwiftLint, actionlint and zizmor (read by
# `swift run vmr analyzers` and by every gate step and hook that runs one of them).
#
# <TOOL>_VERSION                release tag without its prefix: "v" for the analyzers, actionlint and zizmor, none for SwiftLint
# <TOOL>_COMMIT                 full commit SHA the tag points at. INFORMATIONAL: kept so a reviewer can compare it with
#                               the tag; nothing verifies it. The archive digest below is the only check.
# <TOOL>_SHA256_MACOS_ARM64     SHA-256 of the release archive, verified before anything is executed. The archive is
#                               <tool>-<version>-macos-arm64.tar.gz for an analyzer, portable_swiftlint.zip (a
#                               universal binary) for SwiftLint, actionlint_<version>_darwin_arm64.tar.gz for actionlint
#                               and zizmor-aarch64-apple-darwin.tar.gz for zizmor (both with the binary at the root).
#                               Not read from the release's own checksum file (zizmor publishes none), so a tampered
#                               release cannot vouch for itself.
#
# To bump: pick the new tag on the tool's release page, resolve its commit (the tag's ref through the GitHub API,
# following the annotated tag to the commit), download the archive, run shasum -a 256 on it and update all three values
# here. CI runs `swift run vmr check` steps against this file, so nothing else carries the versions. Fingerprints in the
# baselines can move between analyzer versions: regenerate them with `swift run vmr analyzers baseline`. A new SwiftLint
# version can report new violations: fix them in the same change.
#
# Each value is validated before use: the version is [0-9A-Za-z.+-]+, the commit 40 and the digest 64 hexadecimal digits,
# and a key written twice rejects the file.
#
# Release archives are fetched from the address built in Sources/DevTools/Analyzers/ReleaseDownloader.swift.

