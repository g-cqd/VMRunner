name: CI

# Every job runs `swift run vmr ...`, so CI and a local run execute the same steps. This file only decides where and when.
#
#  * `xcode-27` is GitHub's hosted macOS image with Xcode 27 (Swift 6.4); Package.swift needs tools version 6.4, so
#    `macos-26` cannot build it. The label was a preview when this was written: if every job fails at "swift run", check
#    that the label and DEVELOPER_DIR below still exist.
#  * Hosted macOS runners are virtual machines and cannot run nested ones, so CI runs the unit tests and never starts a
#    guest. Views, VMController, Provisioner and ConfigurationBuilder are exercised by hand on a real Mac.
#  * A documentation-only change runs the `lint` job (which includes the documentation check) and skips the rest.
#  * Build caches are restored on every run and saved only from main when the exact key missed, so pull requests never write
#    caches; cache-cleanup.yml prunes old ones.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the superseded run of the same branch or pull request; main and tags always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  # Part of every cache key: bump together with DEVELOPER_DIR.
  TOOLCHAIN_KEY: swift6.4-xcode27.0
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  # What changed decides which heavy jobs run. `code` is anything that is not documentation or repository metadata;
  # `risky` is where memory and thread bugs live (the network stack, the engine, the test support, the dependencies), and
  # gates the sanitizers on pull requests. Anything that is not a pull request or merge group runs everything. If the diff
  # cannot be computed, everything runs.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      risky: ${{ steps.diff.outputs.risky }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: |
          code=true risky=true
          if [ -n "$BASE" ] && files="$(git diff --name-only "$BASE" HEAD)"; then
            code=false risky=false
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              if ! [[ "$file" =~ ^(docs/|LICENSE$|\.github/(ISSUE_TEMPLATE/|CODEOWNERS$|PULL_REQUEST_TEMPLATE\.md$))|\.md$ ]]; then code=true; fi
              if [[ "$file" =~ ^(Sources/VMRunner/(Network|Engine)/|Sources/(TestKit|CTestKitMalloc)/|Package\.(swift|resolved)$) ]]; then risky=true; fi
            done <<<"$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "risky=$risky" >> "$GITHUB_OUTPUT"
          echo "code changes: $code; memory/thread-sensitive changes: $risky"

  lint:
    name: Lint and documentation
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift run vmr check format swiftlint docs

  # One definition for the lanes that differ only in the command and the cache they use. `assert` requires evidence that
  # tests ran: a run that compiled but discovered none (a renamed target, a broken filter) exits 0.
  gate:
    name: ${{ matrix.name }}
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Build and unit tests", run: "vmr check build test", cache: .build, assert: true, upload: .build-ci/ }
          - { name: "Coverage gate", run: "vmr check coverage", cache: .build-cov, upload: .build-cov/coverage-summary.json }
          - { name: "App bundle (hardened, signed, entitlements verified)", run: "vmr build-app release --hardened" }
          - { name: "Static analyzers", run: "vmr check analyzers" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tooling's end-to-end tests run swift-format, SwiftLint, git and codesign. SwiftLint is the release pinned in
      # Scripts/analyzers.lock, which vmr downloads and verifies on first use: there is nothing to install here.
      - name: Restore build cache
        if: ${{ matrix.cache }}
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.cache }}
          key: spm-${{ matrix.cache }}-${{ runner.os }}-${{ runner.arch }}-${{ env.TOOLCHAIN_KEY }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-${{ matrix.cache }}-${{ runner.os }}-${{ runner.arch }}-${{ env.TOOLCHAIN_KEY }}-
      - name: Run
        shell: bash # explicit shell: `bash -eo pipefail`, so a failing command is not hidden by `tee`
        env:
          LANE: ${{ matrix.run }}
          SWIFT_TEST_FLAGS: --xunit-output .build-ci/test-results.xml
        run: |
          mkdir -p .build-ci
          read -ra args <<<"$LANE"
          swift run "${args[@]}" 2>&1 | tee .build-ci/lane.log
      - name: Assert tests ran
        if: ${{ matrix.assert }}
        run: |
          total="$(grep -Eo 'Test run with [0-9]+ tests?' .build-ci/lane.log | awk '{ total += $4 } END { print total + 0 }')"
          echo "Swift Testing ran ${total} test(s)"
          [ "$total" -ge 1 ] || { echo "::error::the run executed no tests"; exit 1; }
      - name: Save build cache
        if: ${{ matrix.cache && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.cache }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload results
        if: ${{ !cancelled() && matrix.upload }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ strategy.job-index }}
          path: ${{ matrix.upload }}
          if-no-files-found: warn
          retention-days: 14

  # Sanitizers rebuild the graph under instrumentation, so on a pull request they run only when a risky path changed.
  sanitizers:
    name: Sanitizer (${{ matrix.step }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.risky == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        step: [asan, tsan, ubsan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build-${{ matrix.step }}
          key: spm-${{ matrix.step }}-${{ runner.os }}-${{ runner.arch }}-${{ env.TOOLCHAIN_KEY }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-${{ matrix.step }}-${{ runner.os }}-${{ runner.arch }}-${{ env.TOOLCHAIN_KEY }}-
      - name: Tests under the sanitizer
        env:
          STEP: ${{ matrix.step }}
        run: swift run vmr check "$STEP"
      - name: Save build cache
        if: ${{ github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build-${{ matrix.step }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The one required status check. It fails if any job failed or was cancelled and tolerates `skipped`, so a job skipped by
  # the change detection never blocks a merge. `always()` makes it report even when a needed job failed; a plain `needs`
  # would leave a ruleset waiting on a skipped check.
  ci-ok:
    name: CI passed
    if: ${{ always() }}
    needs: [changes, lint, gate, sanitizers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad="$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key)=\(.value.result)"' <<<"$NEEDS")"
          [ -z "$bad" ] || { echo "jobs not successful: $bad" >&2; exit 1; }
