version: 2
updates:
  # Keeps the SHA-pinned actions current: Dependabot rewrites both the SHA and the trailing "# vX.Y.Z" comment.
  # The g-cqd analyzer actions are pinned together with Scripts/analyzers.lock; a Dependabot bump of one of
  # them must be mirrored there (Scripts/analyzers.sh pins fails CI until it is).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  # The package has no dependencies today; this keeps it that way visibly and covers any added later.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
