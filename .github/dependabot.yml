version: 2
updates:
  # Keeps the SHA-pinned actions current: Dependabot rewrites both the SHA and the trailing "# vX.Y.Z" comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  # The VMRunner app has no dependencies. The developer tooling (DevTools, vmr) depends on swift-subprocess and
  # swift-argument-parser, pinned with `exact:` in Package.swift; this proposes their updates, and any added later.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
