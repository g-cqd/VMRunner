# Semantic lint. Formatting belongs to swift-format (.swift-format), so layout rules are off here.
strict: true

included:
  - Sources
  - Plugins
  - Tests

excluded:
  - Sources/TestKit
  - Sources/CTestKitMalloc
  - Tests/TestKitTests
  - .build
  - .build-asan
  - .build-tsan
  - .build-ubsan
  - .build-cov
  - .build-release
  - .build-bench

opt_in_rules:
  - array_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - lower_acl_than_parent
  - overridden_super_call
  - prefer_self_in_static_references
  - prefer_zero_over_explicit_init
  - private_swiftui_state
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unavailable_function
  - unhandled_throwing_task
  - unowned_variable_capture
  - yoda_condition

analyzer_rules:
  - unused_import

# Layout is swift-format's job.
disabled_rules:
  - trailing_comma
  - opening_brace
  - closing_brace
  - statement_position
  - vertical_whitespace
  - trailing_whitespace
  - todo
  - nesting

force_cast: error
force_try: error
force_unwrapping: error

line_length:
  warning: 140
  error: 160
  ignores_urls: true
  ignores_comments: true

type_body_length:
  warning: 300
  error: 450

file_length:
  warning: 500
  error: 700
  ignore_comment_only_lines: true

function_body_length:
  warning: 60
  error: 100

function_parameter_count:
  warning: 6
  error: 8

cyclomatic_complexity:
  warning: 12
  error: 20
  ignores_case_statements: true

identifier_name:
  min_length: 2
  excluded: [id, vz, to, x, y]

type_name:
  min_length: 3

custom_rules:
  no_dispatch_queue:
    name: "No DispatchQueue"
    regex: '\bDispatchQueue\b'
    message: "Use Swift concurrency (Task, actors, AsyncStream). Pass a queue only where a framework API requires one."
    severity: error
  no_print:
    name: "No print"
    regex: '^\s*print\('
    message: "Use Log (os.Logger) so output is structured and redacted; command-line tools write through Output."
    severity: error
  no_legacy_locks:
    name: "No NSLock / os_unfair_lock"
    regex: '\b(NSLock|NSRecursiveLock|os_unfair_lock|OSAllocatedUnfairLock|pthread_mutex_t)\b'
    message: "Use Mutex from the Synchronization framework."
    severity: error
  no_unchecked_without_reason:
    name: "@unchecked Sendable needs a reason"
    regex: '@unchecked\s+Sendable(?![^\n]*//)'
    message: "Add a trailing comment naming the lock or invariant that makes this safe."
    severity: error
